  <link rel="icon" href="data:,">
  <style>
    @font-face { font-family: Fredoka; src: url(fonts/Fredoka-SemiBold.ttf) format('truetype'); font-weight: 600 700; font-display: swap; }
    @font-face { font-family: Nunito; src: url(fonts/Nunito-Bold.ttf) format('truetype'); font-weight: 700; font-display: swap; }
    html, body { margin: 0; height: 100%; background: #ccdeed; overflow: hidden; font-family: Nunito, sans-serif; }
    #app canvas { display: block; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: linear-gradient(180deg, rgba(10, 20, 35, 0.55), rgba(10, 20, 35, 0.8));
    }
    #overlay[hidden] { display: none; }
    .card {
      max-width: 520px; width: 100%; box-sizing: border-box; padding: 32px 28px; text-align: center; color: #fff;
      background: rgba(0, 0, 0, 0.9); border: 3px solid #0099ff; border-radius: 28px;
    }
    .kicker { font-family: Fredoka, sans-serif; color: #8fd3ff; letter-spacing: 0.12em; font-size: 16px; margin: 0; }
    h1 { font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(34px, 8vw, 52px); margin: 6px 0 12px; }
    p { color: #d9e6f2; margin: 0 0 22px; line-height: 1.45; }
    button {
      font-family: Fredoka, sans-serif; font-weight: 600; font-size: 22px; color: #fff; background: #2196f2;
      border: 0; border-radius: 999px; padding: 14px 34px; margin: 6px; cursor: pointer;
    }
    button:hover { background: #4fb0ff; }
    button.secondary { background: #26384f; }
    button[hidden] { display: none; }
    #version { color: #6f849a; font-size: 13px; margin-top: 10px; }
    #status { color: #9fb3c8; font-size: 14px; min-height: 20px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div class="card">
      <p class="kicker">SQUATOPIA</p>
      <h1>Fireball Range</h1>
      <p>Stand on an alpine ledge and punch fireballs at the targets. Your fist throws the fire, as fast as you punch. 60 seconds, best score wins. Look at a button and pinch to select.</p>
      <p id="best" hidden></p>
      <button id="enter-vr" hidden>Enter VR</button>
      <button id="play-flat" class="secondary" hidden>Play in browser</button>
      <div id="status">Loading…</div>
      <div id="version"></div>
    </div>
  </div>
  <script>
    // Loads the newest release past any cache: version.json is never cached, and every module URL carries its version
    // through an import map, so a new release fetches fresh code while an unchanged one stays cached.
    (async () => {
      let version = 'dev';
      try { version = (await (await fetch('version.json', { cache: 'no-store' })).json()).version; } catch { /* offline */ }
      window.GAME_VERSION = version;
      document.getElementById('version').textContent = 'v' + version;
      const base = new URL('js/', location.href).href;
      const imports = {
        three: new URL('vendor/three/build/three.module.js', location.href).href,
        'three/addons/': new URL('vendor/three/examples/jsm/', location.href).href,
      };
      for (const f of ['main', 'world', 'fx', 'audio', 'ui']) imports[`${base}${f}.js`] = `${base}${f}.js?v=${version}`;
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports });
      document.head.appendChild(map);
      import(`${base}main.js`);
    })();
  </script>
</body>
</html>
